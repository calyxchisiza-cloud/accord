<!doctype html>
<!-- theme #e4eaf8 #1d4ed8 #e7eeff #d5def5 #1d4ed8 -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accord</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>:root {
  --wash: #e4eaf8;
  --ink: #1b1d1f;
  --muted: #8b928a;
  --line: #eef1ee;
  --card: #ffffff;
  --accent: #1d4ed8;
  --soft: #e7eeff;
  --bar: #d5def5;
  --hot: #1d4ed8;
  --up: #1f9d55;
  --down: #e11d48;
  --peach: #f0c7a4;
  --lilac: #c9c3e6;
  --sky: #b7d4ef;
  --shadow: 0 12px 32px rgba(28, 40, 24, 0.05);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  font-family: "Plus Jakarta Sans", Inter, sans-serif;
  color: var(--ink);
  background: var(--wash);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
::selection { background: var(--soft); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #d5ddd4; border-radius: 99px; }

.frame {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 104px minmax(0, 1fr);
  gap: 6px;
  padding: 18px 22px 22px 16px;
}
.rail {
  background: var(--card);
  border-radius: 30px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 0 14px;
  position: sticky;
  top: 18px;
  height: calc(100vh - 36px);
}
.rail button, .mark {
  width: 46px;
  height: 46px;
  border: 0;
  border-radius: 16px;
  background: transparent;
  color: #8d948c;
  display: grid;
  place-items: center;
}
.rail nav { display: flex; flex-direction: column; gap: 6px; margin-top: 18px; }
.rail button.on, .rail button:hover { background: #1c1f1c; color: #fff; }
.grow { flex: 1; }
.avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: var(--soft);
  color: var(--accent);
  display: grid;
  place-items: center;
  font-weight: 700;
}
.stage { padding: 8px 8px 8px 12px; min-width: 0; }
.head { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
.greet { display: flex; align-items: center; gap: 12px; }
.badge-logo {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #fff;
  color: var(--accent);
  display: grid;
  place-items: center;
  box-shadow: var(--shadow);
}
h1 { margin: 0; font-size: 30px; letter-spacing: -0.04em; font-weight: 700; }
.sub { margin: 3px 0 0; color: var(--muted); font-size: 13.5px; }
.tools { display: flex; align-items: center; gap: 10px; }
.finder {
  height: 48px;
  min-width: 260px;
  background: #fff;
  border-radius: 999px;
  display: flex;
  align-items: center;
  padding: 4px 4px 4px 16px;
  box-shadow: var(--shadow);
}
.finder input::placeholder { color: #b0b6ae; }
.go, .round {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 0;
  display: grid;
  place-items: center;
}
.go { background: #1c1f1c; color: #fff; }
.round { background: #fff; color: #6d746c; box-shadow: var(--shadow); position: relative; }
.dot {
  position: absolute;
  top: 8px;
  right: 9px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #ef4444;
  border: 1.5px solid #fff;
}
.stats, .split { display: grid; gap: 16px; margin-top: 18px; }
.stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.split { grid-template-columns: 1.35fr 0.9fr; }
.card {
  background: var(--card);
  border-radius: 22px;
  box-shadow: var(--shadow);
  padding: 16px 18px 14px;
  min-width: 0;
}
.stat-top, .card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.stat-label { display: flex; align-items: center; gap: 8px; color: #667064; font-size: 13px; font-weight: 600; }
.ico {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--soft);
  color: var(--accent);
  display: grid;
  place-items: center;
}
.stat b { display: block; margin: 14px 0 6px; font-size: 30px; letter-spacing: -0.045em; font-variant-numeric: tabular-nums; }
.trend { font-size: 12px; font-weight: 700; }
.trend.up { color: var(--up); }
.trend.down { color: var(--down); }
.trend em { font-style: normal; color: var(--muted); font-weight: 500; margin-left: 6px; }
h2 { margin: 0; font-size: 16px; letter-spacing: -0.02em; }
.linkish { border: 0; background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; }
.chart { display: flex; gap: 8px; height: 176px; margin-top: 14px; }
.yaxis { display: flex; flex-direction: column; justify-content: space-between; color: #b0b6ae; font-size: 11px; padding-bottom: 22px; }
.plot { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.bars { flex: 1; display: flex; align-items: flex-end; gap: 12px; border-bottom: 1px dashed #e6ebe4; }
.col { flex: 1; display: flex; align-items: flex-end; height: 100%; }
.bar {
  width: 100%;
  border-radius: 12px 12px 8px 8px;
  background: var(--bar);
  min-height: 8px;
}
.bar.hot {
  background: repeating-linear-gradient(-45deg, var(--hot), var(--hot) 5px, #f4f7f2 5px, #f4f7f2 8px);
}
.days { display: flex; gap: 12px; margin-top: 8px; }
.days span { flex: 1; text-align: center; color: #a3aaa2; font-size: 12px; }
.donut-row { display: flex; align-items: center; gap: 18px; min-height: 176px; }
.donut { position: relative; width: 148px; height: 148px; flex: none; }
.donut svg { width: 148px; height: 148px; transform: rotate(-90deg); }
.donut strong {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: 18px;
  letter-spacing: -0.03em;
}
.legend { display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: #667064; }
.legend div { display: flex; align-items: center; gap: 8px; }
.swatch { width: 8px; height: 8px; border-radius: 50%; }
.list { display: flex; flex-direction: column; }
.item {
  display: grid;
  grid-template-columns: 44px minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  padding: 11px 0;
  border-top: 1px solid var(--line);
}
.item:first-child { border-top: 0; }
.item b { display: block; font-size: 14px; }
.item .sub { font-size: 12px; }
.amt { color: var(--up); font-weight: 700; font-variant-numeric: tabular-nums; }
.pill {
  border: 0;
  border-radius: 999px;
  padding: 6px 10px;
  background: var(--soft);
  color: var(--accent);
  font-size: 12px;
  font-weight: 700;
}
.who { display: flex; align-items: center; gap: 8px; color: #4e564e; font-size: 13px; font-weight: 600; }
.who .avatar { width: 28px; height: 28px; font-size: 12px; }
.empty { color: var(--muted); padding: 18px 0; font-size: 14px; }
.work { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 18px; }
label { display: block; margin: 10px 0 6px; color: var(--muted); font-size: 12px; font-weight: 600; }
input, select, textarea {
  width: 100%;
  border: 0;
  background: #f3f6f2;
  border-radius: 12px;
  padding: 12px 12px;
}
textarea { min-height: 84px; resize: vertical; }
.finder input { width: auto; flex: 1; border: 0; outline: 0; background: transparent; padding: 0; min-width: 0; }
pre { white-space: pre-wrap; background: #f3f6f2; border-radius: 12px; padding: 12px; font-size: 12px; margin: 8px 0 0; }
[hidden] { display: none !important; }
.actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.primary, .quiet {
  border: 0;
  border-radius: 999px;
  padding: 11px 16px;
  font-weight: 700;
}
.primary { background: #1c1f1c; color: #fff; }
.quiet { background: var(--soft); color: var(--ink); }
.error { color: var(--down); min-height: 1.2em; font-size: 13px; font-weight: 600; }
.signin { max-width: 520px; margin-top: 28px; }
@media (max-width: 980px) {
  .frame { grid-template-columns: 1fr; padding: 12px; }
  .rail { position: static; height: auto; flex-direction: row; border-radius: 22px; padding: 10px 12px; overflow: auto; }
  .rail nav { flex-direction: row; margin: 0 0 0 8px; }
  .grow { display: none; }
  .head, .stats, .split, .work { display: grid; grid-template-columns: 1fr; }
  .finder { min-width: 0; }
  .donut-row { flex-wrap: wrap; }
}
</style>
</head>
<body>
  <div class="frame">
    <aside class="rail">
      <div class="mark" title="Accord"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 8a3 3 0 1 0 6 0 3 3 0 0 0-6 0M14 8a3 3 0 1 0 6 0 3 3 0 0 0-6 0M9 16a3 3 0 1 0 6 0 3 3 0 0 0-6 0M9 9.5l2.2 4M15 9.5l-2.2 4"/></svg></div>
      <nav>
        <button class="on" data-view="home" title="Desk"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5M7 10v9h10v-9"/></svg></button>
        <button data-view="keys" title="Keys"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 15a4 4 0 1 1 .2-8 4 4 0 0 1-.2 8zM12 11h8M17 11v3"/></svg></button>
        <button data-view="locks" title="Locks"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 11V8a4 4 0 1 1 8 0v3M6 11h12v9H6z"/></svg></button>
      </nav>
      <div class="grow"></div>
      <div class="avatar" id="avatar">A</div>
    </aside>
    <main class="stage">
      <header class="head">
        <div class="greet">
          <div class="badge-logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 8a3 3 0 1 0 6 0 3 3 0 0 0-6 0M14 8a3 3 0 1 0 6 0 3 3 0 0 0-6 0M9 16a3 3 0 1 0 6 0 3 3 0 0 0-6 0M9 9.5l2.2 4M15 9.5l-2.2 4"/></svg></div>
          <div>
            <h1 id="hello">Hello</h1>
            <p class="sub" id="sub">This page talks to the node that served it.</p>
          </div>
        </div>
        <div class="tools">
          <div class="finder">
            <input id="filter" placeholder="Search Anything...">
            <button class="go" id="filter-go" title="Search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16zM21 21l-4.3-4.3"/></svg></button>
          </div>
          <button class="round" id="refresh" title="Refresh"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9a6 6 0 1 1 12 0c0 7 3 7 3 7H3s3 0 3-7M10 20a2 2 0 0 0 4 0"/></svg></button>
        </div>
      </header>
      <div id="view-home">
        <section class="stats">
          <article class="card"><div class="stat-label"><span class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 12a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM6 19a6 6 0 0 1 12 0"/></svg></span>Role</div><b id="role">…</b><div class="trend up" id="role-note">this node</div></article>
          <article class="card"><div class="stat-label"><span class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 7v6l4 2M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z"/></svg></span>Term</div><b id="term">…</b><div class="trend up">election <em>current term</em></div></article>
          <article class="card"><div class="stat-label"><span class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V10M10 19V5M16 19v-7M22 19H2"/></svg></span>Commit</div><b id="commit">…</b><div class="trend up">log <em>applied index</em></div></article>
        </section>
        <section class="split">
          <article class="card">
            <div class="card-top"><h2>Commit</h2><span class="sub">Last seven readings</span></div>
            <div class="chart"><div class="yaxis"><span id="ymax">0</span><span id="ymid">0</span><span>0</span></div><div class="plot"><div class="bars" id="bars"></div><div class="days" id="days"></div></div></div>
          </article>
          <article class="card">
            <div class="card-top"><h2>Node</h2><button class="linkish" data-open="keys">See all</button></div>
            <div class="donut-row">
              <div class="donut">
                <svg viewBox="0 0 148 148"><circle cx="74" cy="74" r="54" fill="none" stroke="#eef2ea" stroke-width="16"></circle><circle id="arc-a" cx="74" cy="74" r="54" fill="none" stroke="var(--accent)" stroke-width="16"></circle><circle id="arc-b" cx="74" cy="74" r="54" fill="none" stroke="var(--lilac)" stroke-width="16"></circle></svg>
                <strong id="donut-center">…</strong>
              </div>
              <div class="legend">
                <div><i class="swatch" style="background:var(--accent)"></i><span id="legend-a">Leader</span></div>
                <div><i class="swatch" style="background:var(--lilac)"></i><span id="legend-b">This node</span></div>
              </div>
            </div>
          </article>
        </section>
        <section class="split">
          <article class="card">
            <div class="card-top"><h2>Activity</h2><button class="linkish" data-open="locks">See all</button></div>
            <div class="list" id="activity"><p class="empty">Nothing recorded on this page yet.</p></div>
          </article>
          <article class="card">
            <div class="card-top"><h2>Latest reply</h2></div>
            <pre id="out">Waiting for this node.</pre>
            <p class="error" id="err"></p>
          </article>
        </section>
      </div>
      <div class="work" id="view-keys" hidden>
        <article class="card">
          <h2>Key</h2>
          <label>Key</label><input id="key" value="color">
          <label>Value</label><input id="value" value="blue">
          <div class="actions"><button class="primary" id="save">Save</button><button class="quiet" id="read">Read</button><button class="quiet" id="del">Delete</button></div>
        </article>
      </div>
      <div class="work" id="view-locks" hidden>
        <article class="card">
          <h2>Lock</h2>
          <label>Name</label><input id="lock" value="payments">
          <label>Owner</label><input id="owner" value="worker-1">
          <div class="actions"><button class="primary" id="acquire">Acquire</button><button class="quiet" id="release">Release</button></div>
        </article>
      </div>
    </main>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
    const samples = [];
    const activity = [];
    function show(name) {
      document.querySelectorAll("[data-view]").forEach((button) => button.classList.toggle("on", button.dataset.view === name));
      ["home", "keys", "locks"].forEach((view) => { $("view-" + view).hidden = view !== name; });
    }
    function bars(values) {
      const v = values.slice(-7);
      while (v.length < 7) v.unshift(0);
      const peak = Math.max(1, ...v);
      let hot = 0;
      v.forEach((n, i) => { if (n >= v[hot]) hot = i; });
      $("ymax").textContent = peak;
      $("ymid").textContent = Math.round(peak / 2);
      $("bars").innerHTML = v.map((n, i) => '<div class="col"><div class="bar' + (n > 0 && i === hot ? " hot" : "") + '" style="height:' + (n ? Math.max(22, (n / peak) * 100) : 16) + '%"></div></div>').join("");
      $("days").innerHTML = ["1", "2", "3", "4", "5", "6", "7"].map((n) => "<span>" + n + "</span>").join("");
    }
    function donut(leader) {
      const c = 2 * Math.PI * 54;
      const len = leader ? c : c * 0.35;
      $("arc-a").setAttribute("stroke-dasharray", len + " " + (c - len));
      $("arc-b").setAttribute("stroke-dasharray", (c - len) + " " + len);
      $("arc-b").setAttribute("stroke-dashoffset", String(-len));
    }
    function paint() {
      const q = $("filter").value.toLowerCase();
      const rows = activity.filter((row) => !q || row.title.toLowerCase().includes(q) || row.detail.toLowerCase().includes(q));
      $("activity").innerHTML = rows.length ? rows.slice(0, 5).map((row) => '<div class="item"><div class="avatar">' + esc(row.title.slice(0, 1).toUpperCase()) + '</div><div><b>' + esc(row.title) + '</b><div class="sub">' + esc(row.detail) + '</div></div><div class="amt">' + esc(row.mark) + "</div></div>").join("") : '<p class="empty">Nothing recorded on this page yet.</p>';
    }
    function note(title, detail, mark) {
      activity.unshift({ title, detail, mark });
      if (activity.length > 8) activity.pop();
      paint();
    }
    async function call(path, options = {}) {
      const response = await fetch(path, options);
      const text = await response.text();
      $("out").textContent = text || response.statusText;
      $("err").textContent = response.ok ? "" : text;
      const label = path.includes("/locks/") ? ($("lock").value || "lock") : ($("key").value || "key");
      note(label, (text || response.statusText).replace(/\s+/g, " ").slice(0, 72), response.ok ? "ok" : "no");
      show("home");
      return response.ok;
    }
    async function status() {
      const row = await (await fetch("/v1/status")).json();
      $("hello").textContent = "Hello, " + row.id + "!";
      $("avatar").textContent = String(row.id || "A").slice(0, 1).toUpperCase();
      $("sub").textContent = row.role === "leader" ? "This node is the leader." : "Leader is " + (row.leader || "undecided") + ".";
      $("role").textContent = row.role;
      $("term").textContent = row.term;
      $("commit").textContent = row.commit;
      $("role-note").textContent = row.role === "leader" ? "leading" : "following";
      $("role-note").className = row.role === "leader" ? "trend up" : "trend down";
      $("donut-center").textContent = row.role === "leader" ? "Lead" : row.role.slice(0, 4);
      $("legend-a").textContent = "Leader · " + (row.leader || "none");
      $("legend-b").textContent = "This node · " + row.id;
      donut(row.role === "leader");
      samples.push(Number(row.commit) || 0);
      if (samples.length > 7) samples.shift();
      bars(samples);
    }
    $("refresh").onclick = () => status();
    $("filter").oninput = paint;
    $("filter-go").onclick = paint;
    $("save").onclick = () => call("/v1/kv/" + $("key").value, { method:"PUT", body:$("value").value });
    $("read").onclick = () => call("/v1/kv/" + $("key").value);
    $("del").onclick = () => call("/v1/kv/" + $("key").value, { method:"DELETE" });
    $("acquire").onclick = () => call("/v1/locks/" + $("lock").value, { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ owner:$("owner").value }) });
    $("release").onclick = () => call("/v1/locks/" + $("lock").value + "?owner=" + encodeURIComponent($("owner").value), { method:"DELETE" });
    document.querySelectorAll("[data-view]").forEach((button) => button.onclick = () => show(button.dataset.view));
    document.querySelectorAll("[data-open]").forEach((button) => button.onclick = () => show(button.dataset.open));
    bars([0, 0, 0, 0, 0, 0, 0]);
    status();
    setInterval(status, 3000);
  </script>
</body>
</html>
